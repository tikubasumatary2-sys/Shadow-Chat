<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shadow Chat</title>

 <style>
#chat {
  display: flex;
  flex-direction: column;
  padding: 10px;
}

.message {
  max-width: 70%;
  padding: 10px;
  margin: 5px;
  border-radius: 10px;
}

.me {
  background: #4caf50;
  color: white;
  align-self: flex-end;
}

.other {
  background: #eee;
  align-self: flex-start;
}
</style>
</head>

<body>

<header>💬 Shadow Chat</header>

<div id="chat"></div>

<div class="inputBox">
  <input id="msg" placeholder="Type message..." />
  <button onclick="sendMsg()">Send</button>
</div>

<script>
const socket = new WebSocket("ws://localhost:8080");

socket.onmessage = (event) => {
  let msg = JSON.parse(event.data);

  messages.push(msg);
  localStorage.setItem("shadowMessages", JSON.stringify(messages));

  render();

  if (msg.user !== "me") {
    playReceive();
  }
};
function playSend() {
  const s = document.getElementById("sendSound");
  s.currentTime = 0;
  s.play().catch(() => {});
}

  <script>
let chatBox = document.getElementById("chat");
let messages = JSON.parse(localStorage.getItem("shadowMessages")) || [];

function render() {
  chatBox.innerHTML = "";
  messages.forEach(m => {
    let div = document.createElement("div");
    div.className = "msg " + (m.user === "me" ? "me" : "");
    div.innerText = m.text;
    chatBox.appendChild(div);
  });
  chatBox.scrollTop = chatBox.scrollHeight;
}

function sendMsg() {
  let input = document.getElementById("msg");
  let text = input.value;

  if (!text) return;

  messages.push({ text: text, user: "me" });
  localStorage.setItem("shadowMessages", JSON.stringify(messages));

  input.value = "";
  render();
}

render();
</script>
<audio id="sendSound" src="send.mp3" preload="auto"></audio>
<audio id="receiveSound" src="receive.mp3" preload="auto"></audio>
 <script>
const sendSound = new Audio("https://www.soundjay.com/buttons/sounds/button-16.mp3");
const receiveSound = new Audio("https://www.soundjay.com/buttons/sounds/button-09.mp3");

// Unlock sound on first click
document.body.addEventListener("click", () => {
    sendSound.play().catch(()=>{});
    receiveSound.play().catch(()=>{});
}, { once: true });
</script> 
</body>
</html>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
