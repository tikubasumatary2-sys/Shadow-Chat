<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shadow Chat</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    header {
      padding: 15px;
      text-align: center;
      background: #111;
      font-size: 18px;
      font-weight: bold;
    }

    #chat {
      height: 85vh;
      overflow-y: auto;
      padding: 10px;
    }

    .msg {
      background: #222;
      padding: 8px 12px;
      margin: 6px 0;
      border-radius: 8px;
      max-width: 80%;
    }

    .me {
      background: #0a84ff;
      margin-left: auto;
      text-align: right;
    }

    .inputBox {
      display: flex;
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #111;
      padding: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 5px;
      outline: none;
    }

    button {
      margin-left: 10px;
      padding: 10px 15px;
      border: none;
      background: #0a84ff;
      color: white;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<header>💬 Shadow Chat</header>

<div id="chat"></div>

<div class="inputBox">
  <input id="msg" placeholder="Type message..." />
  <button onclick="sendMsg()">Send</button>
</div>

<script>
  let chatBox = document.getElementById("chat");

  // Load messages from browser storage
  let messages = JSON.parse(localStorage.getItem("shadowMessages")) || [];

  function render() {
    chatBox.innerHTML = "";
    messages.forEach(m => {
      let div = document.createElement("div");
      div.className = "msg " + (m.user === "me" ? "me" : "");
      div.innerText = m.text;
      chatBox.appendChild(div);
    });

    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function sendMsg() {
    let input = document.getElementById("msg");
    let text = input.value;

    if (!text) return;

    messages.push({ text: text, user: "me" });

    // save locally
    localStorage.setItem("shadowMessages", JSON.stringify(messages));

    input.value = "";
    render();
  }

  render();
</script>
<audio id="sendSound" src="send.mp3" preload="auto"></audio>
<audio id="receiveSound" src="receive.mp3" preload="auto"></audio>
</body>
</html>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
